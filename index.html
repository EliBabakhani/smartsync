<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SmartSync — Reconciliation Console</title>
<meta name="description" content="AI-assisted anomaly detection for SAP ↔ Salesforce data reconciliation." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0F1620;
    --panel: #16202C;
    --panel-2: #1C2733;
    --line: #26313D;
    --text: #E7ECF2;
    --text-dim: #8CA0B3;
    --teal: #4FD1C5;
    --amber: #F2A94E;
    --green: #6FCF97;
    --red: #E0685A;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: 'IBM Plex Mono', monospace; }
  a { color: inherit; }

  .shell { max-width: 1180px; margin: 0 auto; padding: 28px 24px 80px; }

  /* Header */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding-bottom: 22px; border-bottom: 1px solid var(--line); margin-bottom: 26px;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-mark {
    width: 30px; height: 30px; border: 1.5px solid var(--teal); border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
    color: var(--teal); font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600;
  }
  .brand-name { font-weight: 600; font-size: 17px; letter-spacing: 0.2px; }
  .brand-sub { color: var(--text-dim); font-size: 12.5px; margin-top: 1px; }
  .status-pill {
    display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--text-dim);
    font-family: 'IBM Plex Mono', monospace; border: 1px solid var(--line); padding: 6px 12px; border-radius: 20px;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 3px rgba(111,207,151,0.15); }

  /* Intro */
  .intro { max-width: 640px; margin-bottom: 30px; }
  .intro h1 { font-size: 26px; margin: 0 0 8px; font-weight: 600; line-height: 1.3; }
  .intro p { color: var(--text-dim); font-size: 14.5px; line-height: 1.6; margin: 0; }

  /* Stat ledger strip */
  .ledger {
    display: grid; grid-template-columns: repeat(4, 1fr);
    border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin-bottom: 30px;
    background: var(--panel);
  }
  .ledger-cell { padding: 18px 20px; border-right: 1px solid var(--line); }
  .ledger-cell:last-child { border-right: none; }
  .ledger-label { color: var(--text-dim); font-size: 12px; margin-bottom: 8px; }
  .ledger-value { font-family: 'IBM Plex Mono', monospace; font-size: 26px; font-weight: 600; }
  .ledger-value .unit { font-size: 14px; color: var(--text-dim); margin-left: 3px; font-weight: 400; }
  .ledger-delta { font-size: 12px; margin-top: 6px; font-family: 'IBM Plex Mono', monospace; }
  .up { color: var(--red); }
  .down { color: var(--green); }

  /* Two column layout */
  .grid-2 { display: grid; grid-template-columns: 1.1fr 1.5fr; gap: 20px; align-items: start; }
  @media (max-width: 900px) { .grid-2 { grid-template-columns: 1fr; } }

  .panel {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 20px;
  }
  .panel-title { font-size: 13.5px; font-weight: 600; margin: 0 0 4px; }
  .panel-sub { color: var(--text-dim); font-size: 12px; margin: 0 0 18px; }

  /* Trend chart (hand-drawn svg) */
  .trend-svg { width: 100%; height: 130px; display: block; }
  .trend-axis-label { display: flex; justify-content: space-between; margin-top: 6px; font-size: 10.5px; color: var(--text-dim); font-family: 'IBM Plex Mono', monospace; }

  /* Category bars */
  .cat-row { margin-bottom: 13px; }
  .cat-row:last-child { margin-bottom: 0; }
  .cat-top { display: flex; justify-content: space-between; font-size: 12.5px; margin-bottom: 6px; }
  .cat-name { color: var(--text); }
  .cat-count { color: var(--text-dim); font-family: 'IBM Plex Mono', monospace; }
  .cat-track { height: 6px; background: var(--panel-2); border-radius: 3px; overflow: hidden; }
  .cat-fill { height: 100%; border-radius: 3px; }

  /* Table */
  .table-wrap { }
  .row-head, .row {
    display: grid;
    grid-template-columns: 90px 1.3fr 90px 100px 26px;
    gap: 10px; align-items: center;
  }
  .row-head { font-size: 11px; color: var(--text-dim); padding: 0 4px 10px; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
  .row {
    font-size: 13px; padding: 12px 4px; border-bottom: 1px solid var(--line); cursor: pointer;
    transition: background 0.15s ease;
  }
  .row:hover { background: var(--panel-2); }
  .row:last-child { border-bottom: none; }
  .sev {
    font-family: 'IBM Plex Mono', monospace; font-size: 11px; padding: 3px 8px; border-radius: 5px;
    display: inline-block; text-align: center;
  }
  .sev-high { background: rgba(224,104,90,0.15); color: var(--red); }
  .sev-med { background: rgba(242,169,78,0.15); color: var(--amber); }
  .sev-low { background: rgba(140,160,179,0.15); color: var(--text-dim); }
  .record-id { font-family: 'IBM Plex Mono', monospace; color: var(--text-dim); }
  .chevron { color: var(--text-dim); transition: transform 0.15s ease; font-size: 12px; }
  .chevron.open { transform: rotate(90deg); color: var(--teal); }

  .diff-panel {
    grid-column: 1 / -1; margin: 6px 4px 14px; padding: 14px 16px; background: var(--panel-2);
    border-radius: 8px; border: 1px solid var(--line); font-size: 12.5px;
  }
  .diff-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 10px; }
  .diff-col-label { color: var(--text-dim); font-size: 11px; margin-bottom: 6px; font-family: 'IBM Plex Mono', monospace; }
  .diff-field { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px dashed var(--line); font-family: 'IBM Plex Mono', monospace; font-size: 12px; }
  .diff-field:last-child { border-bottom: none; }
  .diff-mismatch { color: var(--amber); }
  .suggested { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); color: var(--text-dim); }
  .suggested b { color: var(--teal); font-weight: 500; }

  .filters { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .filter-btn {
    font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; color: var(--text-dim);
    background: transparent; border: 1px solid var(--line); padding: 6px 12px; border-radius: 20px; cursor: pointer;
  }
  .filter-btn.active { color: var(--bg); background: var(--teal); border-color: var(--teal); font-weight: 600; }

  footer { margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--line); color: var(--text-dim); font-size: 12.5px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
  footer a { color: var(--teal); text-decoration: none; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel" data-type="module">
const { useState, useMemo } = React;

const records = [
  { id: "SO-10482", account: "Nordholm Fabrication", field: "Order total", sap: "$48,200.00", sf: "$46,850.00", severity: "high", category: "Price mismatch", age: "2d" },
  { id: "SO-10486", account: "Cascade Machine Works", field: "Ship qty", sap: "120 units", sf: "96 units", severity: "high", category: "Quantity mismatch", age: "1d" },
  { id: "AC-2291", account: "Bramwell Industrial", field: "Billing address", sap: "Unit 4, Delta Rd", sf: "Unit 4B, Delta Rd", severity: "low", category: "Field drift", age: "6d" },
  { id: "SO-10491", account: "Ferro & Vance Ltd", field: "Record status", sap: "Closed", sf: "Open", severity: "med", category: "Missing sync", age: "3d" },
  { id: "SO-10495", account: "Nordholm Fabrication", field: "Unit price", sap: "$212.50", sf: "$205.00", severity: "med", category: "Price mismatch", age: "12h" },
  { id: "AC-2299", account: "Turlow Metals Co.", field: "Last modified", sap: "Sep 2, 09:14", sf: "Aug 27, 16:40", severity: "low", category: "Stale timestamp", age: "5d" },
  { id: "SO-10502", account: "Cascade Machine Works", field: "Discount %", sap: "8%", sf: "0%", severity: "high", category: "Price mismatch", age: "4h" },
];

const categories = [
  { name: "Price mismatch", count: 14, pct: 100, color: "var(--red)" },
  { name: "Quantity mismatch", count: 9, pct: 64, color: "var(--amber)" },
  { name: "Missing sync", count: 6, pct: 43, color: "var(--teal)" },
  { name: "Field drift / stale", count: 5, pct: 36, color: "var(--text-dim)" },
];

const trend = [38, 44, 41, 35, 30, 27, 22, 24, 19, 16, 14, 12];

function TrendChart() {
  const w = 560, h = 110, pad = 8;
  const max = Math.max(...trend);
  const pts = trend.map((v, i) => {
    const x = pad + (i * (w - pad * 2)) / (trend.length - 1);
    const y = h - pad - (v / max) * (h - pad * 2);
    return [x, y];
  });
  const line = pts.map((p, i) => (i === 0 ? `M${p[0]},${p[1]}` : `L${p[0]},${p[1]}`)).join(" ");
  const area = `${line} L${pts[pts.length - 1][0]},${h} L${pts[0][0]},${h} Z`;
  return (
    <svg className="trend-svg" viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none">
      <defs>
        <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="#4FD1C5" stopOpacity="0.25" />
          <stop offset="100%" stopColor="#4FD1C5" stopOpacity="0" />
        </linearGradient>
      </defs>
      <path d={area} fill="url(#fade)" />
      <path d={line} fill="none" stroke="#4FD1C5" strokeWidth="2" />
      {pts.map((p, i) => (
        <circle key={i} cx={p[0]} cy={p[1]} r={i === pts.length - 1 ? 3.5 : 0} fill="#4FD1C5" />
      ))}
    </svg>
  );
}

function DiffPanel({ record }) {
  return (
    <div className="diff-panel">
      <div className="diff-col-label">FIELD-LEVEL COMPARISON — {record.id}</div>
      <div className="diff-grid">
        <div>
          <div className="diff-col-label">SAP ECC</div>
          <div className="diff-field"><span>{record.field}</span><span className="diff-mismatch">{record.sap}</span></div>
        </div>
        <div>
          <div className="diff-col-label">SALESFORCE</div>
          <div className="diff-field"><span>{record.field}</span><span className="diff-mismatch">{record.sf}</span></div>
        </div>
      </div>
      <div className="suggested">
        Suggested action: <b>Treat SAP as source of truth</b> for financial fields on closed-book orders; push correction to Salesforce and log the delta for the weekly drift report.
      </div>
    </div>
  );
}

function App() {
  const [filter, setFilter] = useState("all");
  const [openRow, setOpenRow] = useState(null);

  const filtered = useMemo(() => {
    if (filter === "all") return records;
    return records.filter(r => r.severity === filter);
  }, [filter]);

  return (
    <div className="shell">
      <div className="topbar">
        <div className="brand">
          <div className="brand-mark">S/S</div>
          <div>
            <div className="brand-name">SmartSync</div>
            <div className="brand-sub">Reconciliation console — SAP ECC ↔ Salesforce</div>
          </div>
        </div>
        <div className="status-pill"><span className="dot"></span>Last sync 4 min ago</div>
      </div>

      <div className="intro">
        <h1>Every record that drifted between your ERP and CRM, ranked by what it'll cost you.</h1>
        <p>SmartSync compares SAP and Salesforce exports on a schedule, scores every mismatch by business impact, and gives your team a short, ranked list instead of two spreadsheets and a headache.</p>
      </div>

      <div className="ledger">
        <div className="ledger-cell">
          <div className="ledger-label">Records compared</div>
          <div className="ledger-value">4,812</div>
        </div>
        <div className="ledger-cell">
          <div className="ledger-label">Open discrepancies</div>
          <div className="ledger-value">34<span className="unit">flagged</span></div>
          <div className="ledger-delta down">↓ 42% vs last month</div>
        </div>
        <div className="ledger-cell">
          <div className="ledger-label">Reconciliation rate</div>
          <div className="ledger-value">99.3<span className="unit">%</span></div>
        </div>
        <div className="ledger-cell">
          <div className="ledger-label">Avg. time to resolve</div>
          <div className="ledger-value">1.8<span className="unit">hrs</span></div>
          <div className="ledger-delta down">was 6.5 hrs, manual</div>
        </div>
      </div>

      <div className="grid-2">
        <div>
          <div className="panel" style={{marginBottom: "20px"}}>
            <div className="panel-title">Open discrepancies, last 12 weeks</div>
            <div className="panel-sub">Weekly count, trending down since rollout</div>
            <TrendChart />
            <div className="trend-axis-label"><span>12 wks ago</span><span>this week</span></div>
          </div>
          <div className="panel">
            <div className="panel-title">By category</div>
            <div className="panel-sub">Share of this month's flagged records</div>
            {categories.map(c => (
              <div className="cat-row" key={c.name}>
                <div className="cat-top"><span className="cat-name">{c.name}</span><span className="cat-count">{c.count}</span></div>
                <div className="cat-track"><div className="cat-fill" style={{width: c.pct + "%", background: c.color}}></div></div>
              </div>
            ))}
          </div>
        </div>

        <div className="panel">
          <div className="panel-title">Flagged records</div>
          <div className="panel-sub">Click a row to see the field-level diff and suggested fix</div>
          <div className="filters">
            {["all","high","med","low"].map(f => (
              <button key={f} className={"filter-btn" + (filter===f ? " active" : "")} onClick={() => setFilter(f)}>
                {f === "all" ? "All" : f.toUpperCase()}
              </button>
            ))}
          </div>
          <div className="table-wrap">
            <div className="row-head">
              <div>Record</div><div>Account / field</div><div>Category</div><div>Severity</div><div></div>
            </div>
            {filtered.map(r => (
              <React.Fragment key={r.id}>
                <div className="row" onClick={() => setOpenRow(openRow === r.id ? null : r.id)}>
                  <div className="record-id">{r.id}</div>
                  <div>{r.account}<div style={{color: "var(--text-dim)", fontSize: "11.5px"}}>{r.field}</div></div>
                  <div style={{color: "var(--text-dim)", fontSize: "12px"}}>{r.category}</div>
                  <div><span className={"sev sev-" + r.severity}>{r.severity.toUpperCase()}</span></div>
                  <div className={"chevron" + (openRow === r.id ? " open" : "")}>›</div>
                </div>
                {openRow === r.id && <DiffPanel record={r} />}
              </React.Fragment>
            ))}
          </div>
        </div>
      </div>

      <footer>
        <span>SmartSync — a case study project by Elnaz · rules-based reconciliation engine, built as a portfolio demo</span>
        <a href="./CASE_STUDY.md">Read the full case study →</a>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
